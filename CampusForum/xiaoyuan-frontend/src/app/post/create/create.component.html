<div class="create-post-container">
  <h2>发布新帖子</h2>
  <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">标题</label>
      <input type="text" id="title" formControlName="title" class="form-control" placeholder="请输入标题">
      <div *ngIf="postForm.get('title')?.invalid && postForm.get('title')?.touched" class="error-message">
        标题不能为空
      </div>
    </div>
    <div class="form-group">
      <label for="content">内容</label>
      <textarea id="content" formControlName="content" class="form-control" rows="6" placeholder="请输入内容"></textarea>
      <div *ngIf="postForm.get('content')?.invalid && postForm.get('content')?.touched" class="error-message">
        内容不能为空
      </div>
    </div>
    
    <!-- 图片上传区域 -->
    <div class="form-group">
      <label for="images">添加图片</label>
      <input type="file" id="images" multiple accept="image/*" (change)="onImagesSelected($event)" class="form-control">
      <small class="form-text text-muted">可以选择多张图片（JPG, PNG, GIF等格式）</small>
      
      <!-- 图片预览区域 -->
      <div class="image-preview-container" *ngIf="imagePreviewUrls.length > 0">
        <div class="image-preview" *ngFor="let imageUrl of imagePreviewUrls; let i = index">
          <img [src]="imageUrl" alt="预览图片">
          <button type="button" class="remove-image-btn" (click)="removeImage(i)">×</button>
        </div>
      </div>
    </div>
    
    <button type="submit" class="btn-submit" [disabled]="postForm.invalid">发布</button>
  </form>
</div>
