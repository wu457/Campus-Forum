<div class="password-container">
  <h2>修改密码</h2>
  <form (ngSubmit)="onSubmit()" [formGroup]="passwordForm">
    <div class="form-group">
      <label>当前密码</label>
      <input formControlName="oldPassword" type="password" />
      <div *ngIf="passwordForm.get('oldPassword')?.invalid && passwordForm.get('oldPassword')?.touched" class="error-hint">
        请输入当前密码
      </div>
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input formControlName="newPassword" type="password" />
      <div *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched" class="error-hint">
        新密码至少需要6个字符
      </div>
    </div>
    <div class="form-group">
      <label>确认新密码</label>
      <input formControlName="confirmPassword" type="password" />
      <div *ngIf="passwordForm.get('confirmPassword')?.touched && passwordForm.hasError('mismatch')" class="error-hint">
        两次输入的密码不一致
      </div>
    </div>
    <button type="submit" [disabled]="passwordForm.invalid">确认修改</button>
  </form>
  <div *ngIf="successMsg" class="success-msg">{{successMsg}}</div>
  <div *ngIf="errorMsg" class="error-msg">{{errorMsg}}</div>
</div>
