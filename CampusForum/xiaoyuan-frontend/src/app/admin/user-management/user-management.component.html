<div class="user-management-container">
  <h1>用户管理</h1>
  
  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>
  
  <div *ngIf="loading" class="loading">
    加载中...
  </div>
  
  <div *ngIf="!loading" class="user-table-container">
    <table class="user-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>用户名</th>
          <th>邮箱</th>
          <th>角色</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>
            <span [ngClass]="{'admin-role': user.role === 'admin', 'user-role': user.role === 'user'}">{{ user.role }}</span>
          </td>
          <td class="actions">
            <button (click)="editUser(user)" class="edit-btn">编辑角色</button>
            <button (click)="deleteUser(user.id)" class="delete-btn">删除</button>
          </td>
        </tr>
        <tr *ngIf="users.length === 0">
          <td colspan="5" class="no-data">暂无用户数据</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- 编辑用户角色的弹窗 -->
  <div *ngIf="editingUser" class="edit-modal">
    <div class="modal-content">
      <h2>编辑用户角色</h2>
      <p><strong>用户名:</strong> {{ editingUser.username }}</p>
      
      <div class="form-group">
        <label for="role">角色:</label>
        <select id="role" [(ngModel)]="newRole">
          <option value="user">普通用户</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      
      <div class="modal-actions">
        <button (click)="saveUserRole()" class="save-btn">保存</button>
        <button (click)="cancelEdit()" class="cancel-btn">取消</button>
      </div>
    </div>
  </div>
</div>
